<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11111b">
  <title>Cdfreds | Home</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f7f5ff;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(124, 58, 237, .24), transparent 35%),
        radial-gradient(circle at 80% 75%, rgba(59, 130, 246, .18), transparent 35%),
        #11111b;
    }
    main { text-align: center; max-width: 650px; }
    .tag {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      color: #c9b8ff;
      background: rgba(255,255,255,.05);
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    h1 {
      margin: 22px 0 12px;
      font-size: clamp(48px, 10vw, 88px);
      letter-spacing: -4px;
      line-height: 1;
    }
    h1 span {
      color: #a78bfa;
      text-shadow: 0 0 35px rgba(167,139,250,.35);
    }
    p { color: #b8b5c7; font-size: 18px; line-height: 1.6; }
    button {
      margin-top: 22px;
      padding: 14px 25px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(99,102,241,.3);
      transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(99,102,241,.42); }
    button:focus-visible { outline: 3px solid #c4b5fd; outline-offset: 4px; }
    #message { min-height: 28px; margin-top: 18px; color: #c4b5fd; font-size: 16px; }
    footer { position: fixed; bottom: 18px; color: #777487; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="tag">Personal Website</div>
    <h1>Hey, I'm <span>Cdfreds</span>.</h1>
    <p>This is my website. I will be adding projects here soon.</p>
    <button type="button" onclick="showMessage1()">Projects</button>
    <button type="button" onclick="showMessage2()">Polygon RP</button>
    <div id="message" aria-live="polite"></div>
  </main>
  <footer>© <span id="year"></span> Cdfreds</footer>
  <script>
    function showMessage1() {
      document.getElementById("message").textContent = "Coming Soon.";
    }
    function showMessage2() {
      document.getElementById("message").textContent = "https://discord.gg/CJjbxfxFF9";
    }
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
